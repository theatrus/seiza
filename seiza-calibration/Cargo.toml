[package]
name = "seiza-calibration"
description = "Host-neutral calibration for linear images: response kernels, frame-set matching, and pedestal fitting"
version = "0.12.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["astronomy", "astrophotography", "calibration", "flat-field"]
categories = ["science", "multimedia::images"]

[dependencies]
chrono.workspace = true
nalgebra.workspace = true
rayon.workspace = true
schemars = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
seiza-imgproc.workspace = true
seiza-stats.workspace = true
thiserror.workspace = true

[features]
# The C ABI's JSON calls (`library::json`) and their JSON Schema. Only
# seiza-cabi enables it: Rust hosts call the native API, and Python binds it.
json = ["dep:schemars"]
