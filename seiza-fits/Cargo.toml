[package]
name = "seiza-fits"
description = "Fast FITS image I/O, statistics, and MTF autostretch for astrophotography"
version = "0.2.5"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["astronomy", "astrophotography", "fits", "image"]
categories = ["science", "multimedia::images", "parser-implementations"]

[dependencies]
fitsio-pure = { version = "0.15.4", default-features = false, features = ["std"] }
seiza-stretch.workspace = true

[dev-dependencies]
memmap2.workspace = true
tempfile = "3"
