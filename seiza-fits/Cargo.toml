[package]
name = "seiza-fits"
description = "Fast FITS image I/O, statistics, and MTF autostretch for astrophotography"
version = "0.7.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["astronomy", "astrophotography", "fits", "image"]
categories = ["science", "multimedia::images", "parser-implementations"]

[dependencies]
flate2.workspace = true
memmap2.workspace = true
multiversion = "0.9"
rayon.workspace = true
seiza-stretch.workspace = true
tempfile = "3"

# A plain fsync when an Apple file system refuses a full sync; see
# `sync_file`.
[target.'cfg(target_vendor = "apple")'.dependencies]
rustix = { version = "1", features = ["fs"] }

