[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "seiza"
description = "Astrometry and image processing for astrophotography"
readme = "README.md"
# Apache-2.0 for the code, OFL-1.1 for the Inter font the labels embed.
license = "Apache-2.0 AND OFL-1.1"
license-files = ["LICENSE-Inter.txt"]
authors = [{ name = "Yann Ramin", email = "github@theatr.us" }]
requires-python = ">=3.9"
keywords = ["astronomy", "astrophotography", "plate-solving", "wcs", "astrometry", "image-stacking", "deconvolution"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = ["numpy>=1.21"]
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/theatrus/seiza"
Homepage = "https://seiza.fyi"

[tool.maturin]
features = ["extension-module"]
module-name = "seiza"
