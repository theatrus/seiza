[package]
name = "seiza-py"
# The Python package version exactly matches the embedded seiza crate's
# version so users can reason about solver behavior from the PyPI
# version; every engine release ships a matching py-vX.Y.Z tag.
version = "0.42.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/theatrus/seiza"
authors = ["Yann Ramin <github@theatr.us>"]
description = "Python bindings for Seiza astrometry and astrophotography image processing"
readme = "README.md"
publish = false

# Deliberately outside the cargo workspace: building against libpython must
# never become a requirement of `cargo build --workspace`. Wheels are built
# with maturin from this directory.
[workspace]

[lib]
name = "seiza_py"
crate-type = ["cdylib"]

[features]
default = []
# Enabled by maturin (see pyproject.toml). Off by default so plain
# `cargo check` in this directory links against a discovered libpython.
extension-module = ["pyo3/extension-module"]

[dependencies]
seiza = { path = "../seiza", features = ["downloads"] }
seiza-background = { path = "../seiza-background" }
seiza-calibration = { path = "../seiza-calibration" }
seiza-deconvolution = { path = "../seiza-deconvolution" }
seiza-fits = { path = "../seiza-fits" }
seiza-image-io = { path = "../seiza-image-io" }
seiza-imgproc = { path = "../seiza-imgproc" }
seiza-satellites = { path = "../seiza-satellites" }
seiza-sources = { path = "../seiza-sources" }
seiza-parallax = { path = "../seiza-parallax" }
seiza-stacking = { path = "../seiza-stacking" }
seiza-stars = { path = "../seiza-stars" }
seiza-stretch = { path = "../seiza-stretch" }
pyo3 = { version = "0.29", features = ["abi3-py311"] }
numpy = "0.29"
image = { version = "0.25", default-features = false }
tokio = { version = "1", features = ["rt"] }
serde = "1"
serde_json = "1"

# Line tables only, and no debug info in dependencies, as the workspace's
# dev profile, for the same saving in maturin develop builds.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = true
codegen-units = 1
