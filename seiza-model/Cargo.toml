[package]
name = "seiza-model"
description = "Learned image restoration for astrophotography: tiling, noise input and an ONNX Runtime backend"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["astronomy", "astrophotography", "denoising", "onnx", "image-processing"]
categories = ["science", "multimedia::images"]

[features]
default = ["download"]
# `ModelStore::download`: install a model the hosted manifest offers, through
# `seiza-download`. A host that ships its own models can leave it out.
download = ["dep:seiza-download", "dep:tokio"]

[dependencies]
directories.workspace = true
half = "2"
libloading = "0.9"
# `load-dynamic` links nothing: ONNX Runtime is found and opened at run time,
# so a build needs no native library and a machine without one still runs
# everything else in Seiza. Pinned exactly because `ort` is a release candidate
# whose API changes between candidates.
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "half", "coreml", "cuda", "tensorrt", "nvrtx", "webgpu"] }
rayon.workspace = true
seiza-download = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt"] }
