[package]
name = "seiza-image-io"
version = "0.12.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
description = "Open and save images by file extension, the same way across Seiza: PNG, JPEG, TIFF, FITS and XISF"
keywords = ["astronomy", "fits", "xisf", "image", "astrophotography"]
categories = ["science", "multimedia::images"]

[features]
# EXIF JPEG fixture builders for other crates' tests; not a public API.
test-support = []

[dependencies]
chrono.workspace = true
image = { workspace = true, features = ["png", "jpeg", "tiff"] }
kamadak-exif.workspace = true
seiza-core.workspace = true
seiza-fits.workspace = true
seiza-xisf.workspace = true
serde.workspace = true
tempfile = "3"
thiserror.workspace = true
