[package]
name = "seiza-stacking"
description = "Linear calibration, registration, normalization, and live image stacking for Seiza"
version = "0.54.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["astronomy", "astrophotography", "stacking", "fits"]
categories = ["science", "multimedia::images"]

[features]
default = ["gpu"]
# Run stacking's heavy passes on the GPU when one is present, through wgpu,
# where each request's GpuOptions allow it. Without it, every pass runs on
# the CPU.
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck", "dep:objc2-metal", "dep:windows"]
# JSON Schema for the types the C ABI's flat stability calls carry. Only
# seiza-cabi enables it.
schema = ["dep:schemars"]

[dependencies]
nalgebra.workspace = true
multiversion = "0.9"
wgpu = { workspace = true, optional = true }
pollster = { workspace = true, optional = true }
bytemuck = { workspace = true, optional = true }
rayon.workspace = true
same-file = "1.0"
schemars = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
postcard.workspace = true
sha2.workspace = true
statrs.workspace = true
seiza.workspace = true
seiza-calibration.workspace = true
seiza-fits.workspace = true
seiza-image-io.workspace = true
seiza-imgproc.workspace = true
seiza-stats.workspace = true
seiza-xisf.workspace = true
seiza-stretch.workspace = true
tempfile = "3"
thiserror.workspace = true
zstd.workspace = true

# What a Metal device's memory is and holds, which wgpu does not report;
# the version wgpu uses.
[target.'cfg(target_vendor = "apple")'.dependencies]
objc2-metal = { version = "0.3.2", optional = true, default-features = false, features = ["MTLDevice"] }

# DXGI reports this process's allocations, including shared buffers which
# bypass wgpu's allocator on integrated Direct3D 12 devices.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", optional = true, default-features = false, features = ["Win32_Graphics_Dxgi"] }

[dev-dependencies]
naga.workspace = true
