[package]
name = "seiza-stacking"
description = "Linear calibration, registration, normalization, and live image stacking for Seiza"
version = "0.45.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["astronomy", "astrophotography", "stacking", "fits"]
categories = ["science", "multimedia::images"]

[features]
default = ["gpu"]
# Run stacking's heavy passes on the GPU when one is present, through wgpu,
# where each request's GpuOptions allow it. Without it, every pass runs on
# the CPU.
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]

[dependencies]
multiversion = "0.9"
wgpu = { workspace = true, optional = true }
pollster = { workspace = true, optional = true }
bytemuck = { workspace = true, optional = true }
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
postcard.workspace = true
sha2.workspace = true
statrs.workspace = true
seiza.workspace = true
seiza-calibration.workspace = true
seiza-fits.workspace = true
seiza-image-io.workspace = true
seiza-imgproc.workspace = true
seiza-stats.workspace = true
seiza-xisf.workspace = true
seiza-stretch.workspace = true
tempfile = "3"
thiserror.workspace = true
zstd.workspace = true

[dev-dependencies]
naga.workspace = true
