# Core functions hosts use. Every function a core crate exports from its
# root, and every public method of these objects hosts hold, must be called
# by the C ABI; otherwise an entry says why not. "crate::*" covers a whole
# crate of building blocks.
[core_functions]
objects = [
    "seiza-parallax::Parallax",
    "seiza-stacking::LiveStacker",
    "seiza-background::BackgroundFit",
    "seiza-stacking::ColorCalibration",
]

