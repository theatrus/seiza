# Binding parity: the core crates against the C ABI (seiza-cabi), and the C
# ABI against Python (seiza-py, as seiza-py/seiza.pyi declares it).
# .github/scripts/check_binding_parity.py holds all three to this file in CI;
# AGENTS.md says how to keep them in step.
#
# A string or { python = "..." } gives the Python counterpart, and
# { c = "..." } the C field that carries a core field; { none = "..." } says
# there is none by design, and why. Nothing records a missing counterpart:
# add it to the binding that lacks it.

# The checks compare field names after changing these suffixes.
[conventions]
suffixes = { "_arcsec_per_pixel" = "_arcsec_px", "_parsecs" = "_pc", "_degrees" = "_deg", "_magnitude" = "_mag" }

# Python calls that read keyword arguments themselves (**options): the
# keywords seiza.pyi declares must be the ones the Rust function accepts.
[keywords."ParallaxVideo.__init__"]
source = "seiza-py/src/parallax.rs"
function = "options"
ignore = ["starless", "stars", "wcs", "progress", "cancel"]

# The core type each C type carries. Every public field of the core type
# must reach the C type: under its own name (after the conventions above),
# under the C name given here ({ c = "..." }), or with a reason it does not
# ({ none = "..." }).


