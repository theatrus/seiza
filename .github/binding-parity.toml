# Binding parity: the C ABI (seiza-cabi) against Python (seiza-py, as
# seiza-py/seiza.pyi declares it). .github/scripts/check_binding_parity.py
# holds the two to this file in CI; AGENTS.md says how to keep them in step.
#
# A string or { python = "..." } names the Python counterpart; { none = "..." }
# says Python has none by design; { gap = "..." } records something Python
# should offer but does not yet. Gaps pass, and are the work left.

# C field names are compared with Python's after these suffixes change.
[conventions]
suffixes = { "_arcsec_per_pixel" = "_arcsec_px", "_parsecs" = "_pc", "_degrees" = "_deg", "_magnitude" = "_mag" }

# Python calls that read keyword arguments themselves (**options): the
# keywords seiza.pyi declares must be the ones the Rust function accepts.
[keywords."ParallaxVideo.__init__"]
source = "seiza-py/src/parallax.rs"
function = "options"
ignore = ["starless", "stars", "wcs", "progress", "cancel"]

# Every exported C function (`extern "C" fn seiza_*`, outside `mod tests`): the Python
# name that does the same job, as seiza.pyi declares it — a top-level function or class
# ("solve_blind", "ParallaxVideo") or "Class.member" ("ParallaxVideo.reconfigure",
# "LiveStacker.accepted_frames") — or why Python has none.
[functions]

# --- parallax ---------------------------------------------------------------
# Python's ParallaxVideo takes the split images and a Wcs; it does not split or
# solve, so a Python caller runs rc_astro_split_stars and a solve first.
seiza_parallax_prepare_json = "ParallaxVideo"
seiza_parallax_reconfigure_json = "ParallaxVideo.reconfigure"
seiza_parallax_summary_json = "ParallaxVideo.summary"
