# Core functions hosts use. Every function a core crate exports from its
# root, and every public method of these objects hosts hold, must be called
# by the C ABI; otherwise an entry says why not. "crate::*" covers a whole
# crate of building blocks.
[core_functions]
objects = [
    "seiza-parallax::Parallax",
    "seiza-stacking::LiveStacker",
    "seiza-background::BackgroundFit",
    "seiza-stacking::ColorCalibration",
]

# Public modules' functions that are building blocks, or that the bindings
# reach through a larger call.
"seiza::blind::*" = { none = "blind solving; the C ABI solves through solve_with_prior, which calls it" }
"seiza::solve::solve_with_limits" = { none = "hinted solving; the C ABI solves through solve_with_prior, which calls it" }
"seiza::catalog::*" = { none = "catalog arithmetic for the solver, field objects and parallax" }
"seiza::constellations::project_figures" = { none = "project, which both bindings call, wraps it with the attribution" }
