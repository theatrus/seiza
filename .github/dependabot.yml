version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    ignore:
      # A release candidate, pinned exactly: its API changes between candidates,
      # and a new one can raise the Rust floor.
      - dependency-name: "ort"
    groups:
      cargo-dependencies:
        patterns:
          - "*"

  # The Python bindings keep their own lockfile outside the workspace.
  - package-ecosystem: cargo
    directory: /seiza-py
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "ort"
    groups:
      seiza-py-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "dtolnay/rust-toolchain"
    groups:
      github-actions:
        patterns:
          - "*"
