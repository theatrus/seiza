name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2.9.3
      - uses: taiki-e/install-action@v2.87.31
        with:
          tool: cargo-nextest
      # nextest runs the tests of every binary in parallel, where cargo test runs
      # one binary at a time. It does not run doctests, hence the second step.
      - run: cargo nextest run --workspace --all-features
      - run: cargo test --doc --workspace --all-features
      - run: cargo build --workspace --release --all-features
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Test scientific regression gates
        run: python -m unittest discover -s regression -p "test_*.py" -v
      - name: Build regression fixture helper
        run: cargo build -p seiza-cli --release --example regression_fixtures --locked
      - name: Run offline scientific corpus
        run: python regression/run.py --repeats 3 --output target/regression/offline.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: scientific-regression-${{ matrix.os }}
          path: target/regression/offline.json
      - name: Verify Windows CRT is statically linked
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./.github/scripts/assert-static-crt.ps1 -Binary target/release/seiza.exe
      # Built unsigned on purpose. Authenticode signing lives only in the
      # release workflow: a pull request from a fork cannot mint the OIDC token
      # the signing account requires, so the step would be skipped there and
      # prove nothing, and CI runs on every push and pull request, which would
      # spend the Basic tier's 5,000 signatures a month on installers that are
      # never published. This MSI exists to be installed and uninstalled by the
      # step below, not to be handed to anyone.
      - name: Build Windows MSI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object name -eq "seiza-cli").version
          dotnet build packaging/windows/seiza.wixproj -c Release -p:SeizaVersion=$version
      - name: Smoke-test Windows MSI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $msi = Get-ChildItem dist/*.msi | Select-Object -First 1
          ./.github/scripts/test-windows-installer.ps1 -Msi $msi.FullName -Scope perUser
          ./.github/scripts/test-windows-installer.ps1 -Msi $msi.FullName -Scope perMachine
          ./.github/scripts/test-windows-installer.ps1 -Msi $msi.FullName -Scope perUser -WithoutPath
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Windows'
        with:
          name: windows-installer
          path: dist/*.msi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2.9.3
      - name: Test release dependency-chain guard
        run: python3 .github/scripts/test_check_release_version_chain.py
      - name: Test the binding parity check
        run: python3 .github/scripts/test_check_binding_parity.py
      # The C ABI and Python offer the same things; see AGENTS.md.
      - name: Check C ABI and Python parity
        run: >-
          python3 .github/scripts/check_binding_parity.py
          ${{ github.event_name == 'pull_request' && format('--base {0}', github.event.pull_request.base.sha) || '' }}
      - name: Verify release dependency version chain
        if: github.event_name == 'pull_request'
        run: python3 .github/scripts/check_release_version_chain.py "${{ github.event.pull_request.base.sha }}"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # seiza-fits reads and writes FITS in browsers and WASI runtimes
      # (FitsImage::from_bytes, write_f32_image_to); keep it building there.
      - name: Check seiza-fits builds for wasm
        run: cargo check -p seiza-fits --target wasm32-unknown-unknown
      # seiza-cabi's build script regenerates its C header with cbindgen. Fail
      # if a source change was not committed alongside a regenerated header.
      - name: Verify seiza-cabi C header is in sync
        run: |
          cargo build -p seiza-cabi
          git diff --exit-code -- seiza-cabi/include/seiza_cabi.h \
            || { echo "::error::seiza_cabi.h is stale; run 'cargo build -p seiza-cabi' and commit include/seiza_cabi.h"; exit 1; }

  # Verify the workspace still compiles on its declared MSRV
  # (`rust-version` in [workspace.package]). Keep this toolchain in sync
  # with that field.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@v2.9.3
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: cargo +1.89.0 check --workspace --all-targets --all-features --locked
      - run: cargo +1.89.0 check --manifest-path seiza-py/Cargo.toml --all-targets --locked

  integration:
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2.9.3
      - run: cargo test -p seiza-cli --release --test hosted_integration -- --ignored
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/cache@v6
        with:
          path: target/regression/hosted
          key: scientific-corpus-v1-${{ hashFiles('regression/hosted.json') }}
      - name: Build regression fixture helper
        run: cargo build -p seiza-cli --release --example regression_fixtures --locked
      - name: Run pinned camera-image corpus
        run: python regression/run.py --hosted --download --repeats 3 --output target/regression/hosted.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: scientific-regression-hosted
          path: target/regression/hosted.json
